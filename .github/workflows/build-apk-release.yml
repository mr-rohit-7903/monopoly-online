name: Build Android APKs & Release v1.0.0

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install dependencies
        run: npm ci

      - name: 6. Prebuild Android native code
        run: npx expo prebuild --platform android --no-install

      - name: 7. Make gradlew executable
        run: chmod +x android/gradlew

      - name: 8. Build Android Release APK (Modern 64-bit CPUs - Low Size)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 9. Organize and Rename Release APK
        run: |
          mkdir -p release_apks
          APK_DIR="android/app/build/outputs/apk/release"

          # Modern 64-bit ARM CPUs (arm64-v8a) - Optimized low file size
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" release_apks/Monopoly-Banking-v1.0.0-arm64-v8a.apk
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" release_apks/Monopoly-Banking-v1.0.0-arm64-v8a.apk
          fi

          echo "Organized APKs:"
          ls -lh release_apks/

      - name: 10. Create or Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Monopoly Banking v1.0.0"
          body: |
            ## 🎮 Monopoly Banking v1.0.0 Release
            
            Official release of **Monopoly Banking** Android application.
            
            ### 📱 Download (Modern 64-bit CPU Optimized - Low Size):
            - **`Monopoly-Banking-v1.0.0-arm64-v8a.apk`**: Lightweight build optimized for modern 64-bit ARM Android devices.
          files: |
            release_apks/Monopoly-Banking-v1.0.0-arm64-v8a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
