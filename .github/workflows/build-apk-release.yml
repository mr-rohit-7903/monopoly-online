name: Build Android APKs & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install dependencies
        run: npm ci

      - name: 6. Prebuild Android native code
        run: npx expo prebuild --platform android --no-install

      - name: 7. Make gradlew executable
        run: chmod +x android/gradlew

      - name: 8. Build Android Release APK (Modern 64-bit CPUs - Low Size)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 9. Organize and Rename Release APK
        run: |
          mkdir -p release_apks
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          APK_DIR="android/app/build/outputs/apk/release"

          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" "release_apks/Monopoly-Banking-${RELEASE_TAG}-arm64-v8a.apk"
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "release_apks/Monopoly-Banking-${RELEASE_TAG}-arm64-v8a.apk"
          fi

          echo "Organized APKs:"
          ls -lh release_apks/

      - name: 10. Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Monopoly Banking ${{ env.RELEASE_TAG }}"
          body: |
            ## 🎮 Monopoly Banking ${{ env.RELEASE_TAG }} Release
            
            Official release of **Monopoly Banking** Android application.
            
            ### 📱 Download (Modern 64-bit CPU Optimized - Low Size):
            - **`Monopoly-Banking-${{ env.RELEASE_TAG }}-arm64-v8a.apk`**: Lightweight build optimized for modern 64-bit ARM Android devices.
          files: |
            release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
